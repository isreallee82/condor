[project]
name = "condor"
version = "0.1.0"
description = "Telegram bot for Hummingbot trading via Backend API"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]",
    "hummingbot-api-client==1.5.6",
    "python-dotenv",
    "PyYAML",
    "aiohttp",
    "watchfiles",
    "kaleido",
    "plotly",
    "pandas",
    "geckoterminal-py",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "python-jose[cryptography]",
    "faster-whisper",
    # onnxruntime ships no Intel-macOS wheel from 1.24 on; last one that does is 1.23.x.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "pydantic-ai[mcp]",
    "beautifulsoup4>=4.14.3",
    "markdown>=3.10.2",
    "bleach>=6.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "isort", "pre-commit"]

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
"condor.reports" = ["report_runtime.js"]
